<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billiard Club API Documentation</title>
    <!-- Load Swagger UI CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.10.3/swagger-ui.min.css" />
    <style>
        /* Apply the Inter font and ensure full viewport coverage */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .swagger-ui .topbar {
            background-color: #007bff; /* Primary blue color for the topbar */
            padding: 10px 0;
        }
        .swagger-ui .topbar-wrapper a span {
            color: #fff; /* White title text */
            font-weight: 700;
        }
        .swagger-ui .scheme-container {
            background-color: #f8f9fa; /* Light grey background for schemes */
        }
        .swagger-ui .opblock .opblock-summary-method {
            text-shadow: none;
            font-size: 14px;
        }
        /* Custom styling for rounded corners on code blocks */
        .swagger-ui .code {
            border-radius: 8px; 
        }
        /* Ensure the body font is used throughout */
        .swagger-ui * {
            font-family: 'Inter', sans-serif !important;
        }
    </style>
    <!-- Load the Inter font (Tailwind standard) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="swagger-ui"></div>

    <!-- Load Swagger UI JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.10.3/swagger-ui-bundle.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.10.3/swagger-ui-standalone-preset.min.js" crossorigin></script>

    <script>
        // Define the OpenAPI Specification content directly in JavaScript
        const openApiSpec = {
          "openapi": "3.0.0",
          "info": {
            "title": "Billiard Club Manager API",
            "version": "1.0.0",
            "description": "API for managing billiard clubs, categories, and viewing user profiles."
          },
          "servers": [
            {
              "url": "http://127.0.0.1:8080/flightphp_project/backend/api/v1",
              "description": "Local Development Server"
            }
          ],
          "tags": [
            {
              "name": "Clubs",
              "description": "Operations related to Billiard Clubs"
            },
            {
              "name": "Categories",
              "description": "Operations related to Billiard Categories (e.g., 8-Ball, Snooker)"
            },
            {
              "name": "Users",
              "description": "User profile and authentication (mocked to user ID 1)"
            }
          ],
          "paths": {
            "/clubs": {
              "get": {
                "tags": [
                  "Clubs"
                ],
                "summary": "Retrieve all billiard clubs",
                "operationId": "getClubs",
                "responses": {
                  "200": {
                    "description": "A list of billiard clubs.",
                    "content": {
                      "application/json": {
                        "schema": {
                          "type": "object",
                          "properties": {
                            "success": {
                              "type": "boolean",
                              "example": true
                            },
                            "data": {
                              "type": "array",
                              "items": {
                                "$ref": "#/components/schemas/Club"
                              }
                            }
                          }
                        }
                      }
                    }
                  },
                  "500": {
                    "$ref": "#/components/responses/InternalServerError"
                  }
                }
              },
              "post": {
                "tags": [
                  "Clubs"
                ],
                "summary": "Create a new billiard club",
                "operationId": "createClub",
                "requestBody": {
                  "required": true,
                  "content": {
                    "application/json": {
                      "schema": {
                        "$ref": "#/components/schemas/ClubCreate"
                      }
                    }
                  }
                },
                "responses": {
                  "201": {
                    "description": "Club created successfully.",
                    "content": {
                      "application/json": {
                        "schema": {
                          "type": "object",
                          "properties": {
                            "success": {
                              "type": "boolean",
                              "example": true
                            },
                            "id": {
                              "type": "integer",
                              "example": 4
                            },
                            "message": {
                              "type": "string",
                              "example": "Club created successfully."
                            }
                          }
                        }
                      }
                    }
                  },
                  "400": {
                    "$ref": "#/components/responses/BadRequest"
                  }
                }
              }
            },
            "/clubs/{id}": {
              "parameters": [
                {
                  "name": "id",
                  "in": "path",
                  "required": true,
                  "schema": {
                    "type": "integer"
                  },
                  "description": "The ID of the club to retrieve or modify."
                }
              ],
              "get": {
                "tags": [
                  "Clubs"
                ],
                "summary": "Retrieve a single club by ID",
                "operationId": "getClubById",
                "responses": {
                  "200": {
                    "description": "Club details.",
                    "content": {
                      "application/json": {
                        "schema": {
                          "type": "object",
                          "properties": {
                            "success": {
                              "type": "boolean",
                              "example": true
                            },
                            "data": {
                              "$ref": "#/components/schemas/Club"
                            }
                          }
                        }
                      }
                    }
                  },
                  "400": {
                    "$ref": "#/components/responses/BadRequest"
                  },
                  "404": {
                    "$ref": "#/components/responses/NotFound"
                  }
                }
              },
              "put": {
                "tags": [
                  "Clubs"
                ],
                "summary": "Update an existing club",
                "operationId": "updateClub",
                "requestBody": {
                  "required": true,
                  "content": {
                    "application/json": {
                      "schema": {
                        "$ref": "#/components/schemas/ClubUpdate"
                      }
                    }
                  }
                },
                "responses": {
                  "200": {
                    "description": "Club updated successfully.",
                    "content": {
                      "application/json": {
                        "schema": {
                          "$ref": "#/components/schemas/SuccessMessage"
                        }
                      }
                    }
                  },
                  "400": {
                    "$ref": "#/components/responses/BadRequest"
                  },
                  "404": {
                    "$ref": "#/components/responses/NotFound"
                  }
                }
              },
              "delete": {
                "tags": [
                  "Clubs"
                ],
                "summary": "Delete a club by ID",
                "operationId": "deleteClub",
                "responses": {
                  "200": {
                    "description": "Club deleted successfully.",
                    "content": {
                      "application/json": {
                        "schema": {
                          "$ref": "#/components/schemas/SuccessMessage"
                        }
                      }
                    }
                  },
                  "400": {
                    "$ref": "#/components/responses/BadRequest"
                  },
                  "404": {
                    "$ref": "#/components/responses/NotFound"
                  }
                }
              }
            },
            "/categories": {
              "get": {
                "tags": [
                  "Categories"
                ],
                "summary": "Retrieve all categories",
                "operationId": "getCategories",
                "responses": {
                  "200": {
                    "description": "A list of billiard categories.",
                    "content": {
                      "application/json": {
                        "schema": {
                          "type": "object",
                          "properties": {
                            "success": {
                              "type": "boolean",
                              "example": true
                            },
                            "data": {
                              "type": "array",
                              "items": {
                                "$ref": "#/components/schemas/Category"
                              }
                            }
                          }
                        }
                      }
                    }
                  },
                  "500": {
                    "$ref": "#/components/responses/InternalServerError"
                  }
                }
              },
              "post": {
                "tags": [
                  "Categories"
                ],
                "summary": "Create a new category",
                "operationId": "createCategory",
                "requestBody": {
                  "required": true,
                  "content": {
                    "application/json": {
                      "schema": {
                        "$ref": "#/components/schemas/CategoryCreate"
                      }
                    }
                  }
                },
                "responses": {
                  "201": {
                    "description": "Category created successfully.",
                    "content": {
                      "application/json": {
                        "schema": {
                          "type": "object",
                          "properties": {
                            "success": {
                              "type": "boolean",
                              "example": true
                            },
                            "id": {
                              "type": "integer",
                              "example": 4
                            },
                            "message": {
                              "type": "string",
                              "example": "Category created successfully."
                            }
                          }
                        }
                      }
                    }
                  },
                  "400": {
                    "$ref": "#/components/responses/BadRequest"
                  }
                }
              }
            },
            "/categories/{id}": {
              "parameters": [
                {
                  "name": "id",
                  "in": "path",
                  "required": true,
                  "schema": {
                    "type": "integer"
                  },
                  "description": "The ID of the category to retrieve or modify."
                }
              ],
              "get": {
                "tags": [
                  "Categories"
                ],
                "summary": "Retrieve a single category by ID",
                "operationId": "getCategoryById",
                "responses": {
                  "200": {
                    "description": "Category details.",
                    "content": {
                      "application/json": {
                        "schema": {
                          "type": "object",
                          "properties": {
                            "success": {
                              "type": "boolean",
                              "example": true
                            },
                            "data": {
                              "$ref": "#/components/schemas/Category"
                            }
                          }
                        }
                      }
                    }
                  },
                  "400": {
                    "$ref": "#/components/responses/BadRequest"
                  },
                  "404": {
                    "$ref": "#/components/responses/NotFound"
                  }
                }
              },
              "put": {
                "tags": [
                  "Categories"
                ],
                "summary": "Update an existing category",
                "operationId": "updateCategory",
                "requestBody": {
                  "required": true,
                  "content": {
                    "application/json": {
                      "schema": {
                        "$ref": "#/components/schemas/CategoryCreate"
                      }
                    }
                  }
                },
                "responses": {
                  "200": {
                    "description": "Category updated successfully.",
                    "content": {
                      "application/json": {
                        "schema": {
                          "$ref": "#/components/schemas/SuccessMessage"
                        }
                      }
                    }
                  },
                  "400": {
                    "$ref": "#/components/responses/BadRequest"
                  },
                  "404": {
                    "$ref": "#/components/responses/NotFound"
                  }
                }
              },
              "delete": {
                "tags": [
                  "Categories"
                ],
                "summary": "Delete a category by ID",
                "description": "Note: Clubs using this category will have their `category_id` set to 0/NULL.",
                "operationId": "deleteCategory",
                "responses": {
                  "200": {
                    "description": "Category deleted successfully.",
                    "content": {
                      "application/json": {
                        "schema": {
                          "$ref": "#/components/schemas/SuccessMessage"
                        }
                      }
                    }
                  },
                  "400": {
                    "$ref": "#/components/responses/BadRequest"
                  },
                  "404": {
                    "$ref": "#/components/responses/NotFound"
                  }
                }
              }
            },
            "/user/profile": {
              "get": {
                "tags": [
                  "Users"
                ],
                "summary": "Retrieve the current user profile with role name",
                "description": "Currently hardcoded to fetch user ID 1 (System Administrator) from the mock database.",
                "operationId": "getUserProfile",
                "responses": {
                  "200": {
                    "description": "User profile data including role name.",
                    "content": {
                      "application/json": {
                        "schema": {
                          "type": "object",
                          "properties": {
                            "success": {
                              "type": "boolean",
                              "example": true
                            },
                            "data": {
                              "$ref": "#/components/schemas/User"
                            }
                          }
                        }
                      }
                    }
                  },
                  "404": {
                    "$ref": "#/components/responses/NotFound"
                  },
                  "500": {
                    "$ref": "#/components/responses/InternalServerError"
                  }
                }
              }
            }
          },
          "components": {
            "schemas": {
              "Club": {
                "type": "object",
                "properties": {
                  "id": {
                    "type": "integer",
                    "example": 1
                  },
                  "club_name": {
                    "type": "string",
                    "example": "The Corner Pocket"
                  },
                  "owner_name": {
                    "type": "string",
                    "example": "Alice Smith"
                  },
                  "address": {
                    "type": "string",
                    "example": "123 Main St"
                  },
                  "club_member_count": {
                    "type": "integer",
                    "format": "int32",
                    "example": 150
                  },
                  "category_id": {
                    "type": "integer",
                    "format": "int32",
                    "description": "ID of the primary category (0 if none assigned).",
                    "example": 1
                  }
                },
                "required": [
                  "club_name",
                  "owner_name"
                ]
              },
              "ClubCreate": {
                "type": "object",
                "properties": {
                  "club_name": {
                    "type": "string",
                    "example": "New Downtown Club"
                  },
                  "owner_name": {
                    "type": "string",
                    "example": "John Doe"
                  },
                  "address": {
                    "type": "string",
                    "nullable": true,
                    "example": "100 Broadway"
                  },
                  "club_member_count": {
                    "type": "integer",
                    "format": "int32",
                    "example": 50
                  },
                  "category_id": {
                    "type": "integer",
                    "format": "int32",
                    "example": 3
                  }
                },
                "required": [
                  "club_name",
                  "owner_name"
                ]
              },
              "ClubUpdate": {
                "allOf": [
                  {
                    "$ref": "#/components/schemas/ClubCreate"
                  }
                ],
                "example": {
                  "club_name": "Updated Club Name",
                  "owner_name": "New Owner",
                  "address": "200 New Address",
                  "club_member_count": 200,
                  "category_id": 2
                }
              },
              "Category": {
                "type": "object",
                "properties": {
                  "id": {
                    "type": "integer",
                    "example": 1
                  },
                  "category_name": {
                    "type": "string",
                    "example": "9-Ball"
                  }
                },
                "required": [
                  "category_name"
                ]
              },
              "CategoryCreate": {
                "type": "object",
                "properties": {
                  "category_name": {
                    "type": "string",
                    "example": "Carom Billiards"
                  }
                },
                "required": [
                  "category_name"
                ]
              },
              "User": {
                "type": "object",
                "properties": {
                  "id": {
                    "type": "integer",
                    "example": 1
                  },
                  "username": {
                    "type": "string",
                    "example": "SuperAdmin"
                  },
                  "email": {
                    "type": "string",
                    "format": "email",
                    "example": "admin@example.com"
                  },
                  "member_since": {
                    "type": "string",
                    "format": "date",
                    "example": "2022-10-01"
                  },
                  "total_clubs_managed": {
                    "type": "integer",
                    "example": 5
                  },
                  "role_id": {
                    "type": "integer",
                    "example": 1
                  },
                  "role_name": {
                    "type": "string",
                    "description": "The friendly name of the user's role.",
                    "example": "System Administrator"
                  }
                },
                "required": [
                  "username",
                  "email",
                  "role_id",
                  "role_name"
                ]
              },
              "SuccessMessage": {
                "type": "object",
                "properties": {
                  "success": {
                    "type": "boolean",
                    "example": true
                  },
                  "message": {
                    "type": "string",
                    "example": "Operation completed successfully."
                  }
                }
              },
              "ErrorMessage": {
                "type": "object",
                "properties": {
                  "success": {
                    "type": "boolean",
                    "example": false
                  },
                  "message": {
                    "type": "string",
                    "example": "The request was invalid or an error occurred."
                  }
                }
              }
            },
            "responses": {
              "BadRequest": {
                "description": "Bad Request: Missing required fields or validation error.",
                "content": {
                  "application/json": {
                    "schema": {
                      "$ref": "#/components/schemas/ErrorMessage"
                    }
                  }
                }
              },
              "NotFound": {
                "description": "Not Found: Resource does not exist.",
                "content": {
                  "application/json": {
                    "schema": {
                      "$ref": "#/components/schemas/ErrorMessage"
                    }
                  }
                }
              },
              "InternalServerError": {
                "description": "Internal Server Error: A server-side or database error occurred.",
                "content": {
                  "application/json": {
                    "schema": {
                      "$ref": "#/components/schemas/ErrorMessage"
                    }
                  }
                }
              }
            }
          }
        };

        // Initialize Swagger UI
        window.onload = function() {
            // Build a system
            const ui = SwaggerUIBundle({
                spec: openApiSpec, // Load the embedded JSON specification
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout"
            });
            window.ui = ui;
        };
    </script>
</body>
</html>
