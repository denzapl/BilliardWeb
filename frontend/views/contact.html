<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact</title></head><body>
<script>
fetch('inner.html').then(r=>r.text()).then(html=>{
  const content = `<main class="container my-5"><div class="row justify-content-center"><div class="col-md-8"><h2>Contact Us</h2><p>If you want to reach out, use the form below.</p><form id="contactForm"><div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" required></div><div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div><div class="mb-3"><label class="form-label">Message</label><textarea class="form-control" name="message" rows="5" required></textarea></div><button class="btn btn-success" type="submit">Send</button></form><div id="status" class="mt-3"></div></div></div></main>`;
  const out = html.replace('<!--CONTENT-->', content);
  document.open(); document.write(out); document.close();
}).catch(err=>document.body.innerText='Error loading layout: '+err);
</script>
</body></html>
