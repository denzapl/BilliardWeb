<div class="card p-4 shadow-lg">
<form id="editClubForm">
<div id="alertContainer"></div>
<input type="hidden" id="clubId" name="id">

    <h3 class="mb-4 text-primary">Edit Club Details</h3>

    <div class="mb-3">
        <label for="club_name" class="form-label fw-bold">Club Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="club_name" name="club_name" required>
    </div>

    <div class="mb-3">
        <label for="owner_name" class="form-label fw-bold">Owner Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="owner_name" name="owner_name" required>
    </div>

    <div class="mb-3">
        <label for="address" class="form-label fw-bold">Address</label>
        <input type="text" class="form-control" id="address" name="address">
    </div>
    
    <div class="mb-3">
        <label for="club_member_count" class="form-label fw-bold">Member Count</label>
        <input type="number" class="form-control" id="club_member_count" name="club_member_count" min="0" value="0">
    </div>
    
    <div class="mb-3">
        <label for="category_id" class="form-label fw-bold">Category</label>
        <!-- Categories will be loaded here dynamically -->
        <select class="form-select" id="category_id" name="category_id">
            <option value="0">Loading categories...</option>
        </select>
    </div>

    <div class="d-flex gap-2 pt-3 border-top">
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save me-2"></i> Save Changes
        </button>
        <button type="button" class="btn btn-secondary" onclick="window.location.hash='#clubs'">Cancel</button>
    </div>
</form>


</div>
