<h1 class="mb-4">Create New Billiard Club</h1>

<div class="card p-4">
    <form id="createClubForm">
        <div id="alertContainer"></div> <div class="mb-3">
            <label for="club_name" class="form-label">Club Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="club_name" name="club_name" required>
        </div>

        <div class="mb-3">
            <label for="owner_name" class="form-label">Owner Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="owner_name" name="owner_name" required>
        </div>

        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input type="text" class="form-control" id="address" name="address">
        </div>

        <div class="mb-3">
            <label for="category_id" class="form-label">Category</label>
            <select class="form-select" id="category_id" name="category_id">
                <option value="0">Loading Categories...</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="club_member_count" class="form-label">Member Count</label>
            <input type="number" class="form-control" id="club_member_count" name="club_member_count" value="0" min="0">
        </div>

        <button type="submit" class="btn btn-primary">Save Club</button>
        <button type="button" class="btn btn-secondary" onclick="window.location.hash='#clubs'">Cancel</button>
    </form>
</div>

<script>
    // --- JAVASCRIPT LOGIC FOR FORM (Must be in a separate JS file for SPA) ---
    const API_BASE_URL = 'http://127.0.0.1:8080/flightphp_project/backend/api/v1';

    // 1. Function to Load Categories
    async function loadCategories() {
        try {
            const response = await fetch(`${API_BASE_URL}/categories`);
            const data = await response.json();
            const select = document.getElementById('category_id');
            select.innerHTML = '<option value="0">Select a Category (Optional)</option>';
            
            if (data.success && data.data) {
                data.data.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.id;
                    option.textContent = category.category_name;
                    select.appendChild(option);
                });
            }
        } catch (error) {
            console.error('Error loading categories:', error);
        }
    }

    // 2. Function to Handle Form Submission
    document.getElementById('createClubForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const formData = new FormData(this);
        const jsonData = {};
        for (const [key, value] of formData.entries()) {
            jsonData[key] = value;
        }

        try {
            const response = await fetch(`${API_BASE_URL}/clubs`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(jsonData)
            });

            const result = await response.json();
            const alertDiv = document.getElementById('alertContainer');
            alertDiv.innerHTML = ''; // Clear previous messages

            if (response.ok) { // Status 201
                alertDiv.innerHTML = `<div class="alert alert-success">Club created! ID: ${result.id}</div>`;
                document.getElementById('createClubForm').reset(); // Clear form on success
                // Redirect user to the clubs list after a delay
                setTimeout(() => {
                    window.location.hash = '#clubs'; 
                }, 1500);
            } else { // Status 400 or 500
                alertDiv.innerHTML = `<div class="alert alert-danger">${result.message || 'An unknown error occurred.'}</div>`;
            }

        } catch (error) {
            console.error('AJAX submission error:', error);
            document.getElementById('alertContainer').innerHTML = `<div class="alert alert-danger">Network error. Check console.</div>`;
        }
    });

    // Initial call to load categories when the view is injected
    loadCategories(); 
</script>
