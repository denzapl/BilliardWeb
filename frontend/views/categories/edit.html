<div class="card p-4 shadow-lg">
<form id="editCategoryForm">
<div id="alertContainer"></div>
<input type="hidden" id="categoryId" name="id">

    <h3 class="mb-4 text-primary">Edit Category Details</h3>

    <div class="mb-3">
        <label for="category_name" class="form-label fw-bold">Category Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="category_name" name="category_name" required>
    </div>

    <div class="d-flex gap-2 pt-3 border-top">
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save me-2"></i> Save Changes
        </button>
        <button type="button" class="btn btn-secondary" onclick="window.location.hash='#categories'">Cancel</button>
    </div>
</form>


</div>
