<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Update</title></head><body>
<script>
fetch('inner.html').then(r=>r.text()).then(html=>{
  const content = `<main class="container my-5"><div class="card shadow-sm"><div class="card-body"><h2 class="card-title mb-3">Update Item</h2><form id="updateForm"><div class="mb-3"><label class="form-label">Item ID</label><input class="form-control" name="id" required></div><div class="mb-3"><label class="form-label">New Title</label><input class="form-control" name="title"></div><div class="mb-3"><label class="form-label">New Description</label><textarea class="form-control" name="desc" rows="3"></textarea></div><button class="btn btn-warning" type="submit">Update</button></form><div id="result" class="mt-3"></div></div></div></main>`;
  const out = html.replace('<!--CONTENT-->', content);
  document.open(); document.write(out); document.close();
}).catch(err=>document.body.innerText='Error loading layout: '+err);
</script>
</body></html>
