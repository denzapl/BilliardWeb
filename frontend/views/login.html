<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #007bff, #6610f2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
    }

    .card {
      border: none;
      background: #fff;
      border-radius: 25px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    .card-title {
      font-weight: 600;
      color: #333;
    }

    label {
      font-weight: 500;
    }

    .form-control {
      border: 2px solid #e9ecef;
      transition: border-color 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
    }

    .form-control:focus {
      border-color: #007bff;
      box-shadow: 0 0 10px rgba(0, 123, 255, 0.25);
    }

    .btn-primary {
      background: linear-gradient(45deg, #007bff, #6610f2);
      border: none;
      transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    .btn-primary:hover {
      transform: scale(1.03);
      box-shadow: 0 5px 15px rgba(102, 16, 242, 0.4);
    }

    a {
      text-decoration: none;
      color: #6610f2;
      font-weight: 500;
      transition: color 0.2s ease-in-out;
    }

    a:hover {
      color: #007bff;
      text-decoration: underline;
    }

    .small-text {
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm p-4">
          <h2 class="card-title text-center mb-4">Login</h2>
          <form>
            <div class="mb-3">
              <label for="email" class="form-label">Email:</label>
              <input type="email" class="form-control rounded-pill" id="email" placeholder="Enter your email">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password:</label>
              <input type="password" class="form-control rounded-pill" id="password" placeholder="Enter your password">
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg rounded-pill">Login</button>
            </div>
          </form>
          <p class="text-center mt-3 small-text">
            Don't have an account? <a href="#" data-page="register">Register here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
